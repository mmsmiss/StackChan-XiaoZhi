name: Build StackChan firmware

on:
  push:
    branches: [codex-refactor]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upgrade idf-component-manager
        run: pip install --upgrade "idf-component-manager>=2.4.7"

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
